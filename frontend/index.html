<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SentinelPath – Tableau de bord</title>
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <header>
    <h1>Sentinel<span>Path</span></h1>
    <span class="subtitle">Analyse de vulnérabilités et de chemins d'attaque</span>
    <div class="toolbar">
      <label>Analyse :
        <select id="analysis-select"></select>
      </label>
      <button id="analyze-btn">Lancer une analyse</button>
      <form method="post" action="/logout" class="logout">
        <button type="submit" title="Se déconnecter">Déconnexion</button>
      </form>
    </div>
  </header>

  <nav>
    <a href="#dashboard">Vue d'ensemble</a>
    <a href="#vulnerabilities">Vulnérabilités</a>
    <a href="#paths">Chemins d'attaque</a>
    <a href="#graph">Graphe</a>
  </nav>

  <p id="status"></p>

  <main>
    <section id="dashboard">
      <h2>Vue d'ensemble</h2>
      <div id="cards" class="cards"></div>
      <div id="agent-summary" class="agent-summary"></div>
      <div id="severity-bars"></div>
    </section>

    <section id="vulnerabilities">
      <h2>Vulnérabilités</h2>
      <label>Gravité :
        <select id="severity-filter">
          <option value="ALL">Toutes</option>
          <option value="CRITICAL">CRITICAL</option>
          <option value="HIGH">HIGH</option>
          <option value="MEDIUM">MEDIUM</option>
          <option value="LOW">LOW</option>
          <option value="KEV">Exploitées (CISA KEV)</option>
        </select>
      </label>
      <span id="vuln-count"></span>
      <div class="table-wrap"><table id="vuln-table"></table></div>
    </section>

    <section id="paths">
      <h2>Chemins d'attaque classés par risque</h2>
      <p class="hint">Cliquez sur un chemin pour le surligner dans le graphe.</p>
      <div id="path-list"></div>
    </section>

    <section id="graph">
      <h2>Graphe d'attaque</h2>
      <div id="graph-legend"></div>
      <label class="hint"><input type="checkbox" id="show-isolated">
        Afficher les services isolés (sans relation)</label>
      <div id="graph-ask"></div>
      <div id="cy"></div>
    </section>
  </main>

  <!-- Agent IA : bulle flottante en bas a droite, qui ouvre un panneau de discussion -->
  <button id="chat-toggle" title="Discuter avec l'agent IA" aria-label="Ouvrir l'agent IA"></button>
  <aside id="chat-panel" hidden>
    <div class="chat-header">
      <div><strong>Agent IA SentinelPath</strong><br><span id="chat-context" class="hint"></span></div>
      <div class="chat-actions">
        <button id="chat-expand" type="button" title="Agrandir le panneau">Agrandir</button>
        <button id="chat-close" type="button" aria-label="Fermer">×</button>
      </div>
    </div>
    <div id="chat-log"></div>
    <div id="chat-suggestions"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Posez votre question…" autocomplete="off">
      <button type="submit">Envoyer</button>
    </form>
  </aside>

  <!-- app.js en premier : il definit les outils communs utilises par les autres fichiers -->
  <script src="vendor/cytoscape.min.js"></script>
  <script src="app.js?v=9"></script>
  <script src="markdown.js?v=9"></script>
  <script src="dashboard.js?v=9"></script>
  <script src="vulnerabilities.js?v=9"></script>
  <script src="paths.js?v=9"></script>
  <script src="graph.js?v=9"></script>
  <script src="chat.js?v=9"></script>
  <script>refresh();</script>
</body>
</html>
